<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MA Heatmap (Fast 1–255, Slow 1–255)</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .hm-wrap{ max-width: 1200px; margin: 18px auto; padding: 0 14px; }
    .hm-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom: 12px; }
    .hm-title{ font-size: 18px; font-weight: 800; letter-spacing:.2px; }
    .hm-sub{ opacity:.75; font-size: 12px; margin-top: 4px; }

    .hm-grid{ display:grid; grid-template-columns: 420px 1fr; gap: 14px; }
    @media (max-width: 980px){ .hm-grid{ grid-template-columns: 1fr; } }

    .hm-card{ border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.22); border-radius: 14px; padding: 12px; box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
    .hm-card h3{ margin: 0 0 10px; font-size: 13px; opacity:.9; letter-spacing:.2px; }

    .hm-form{ display:grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 10px 12px; }
    @media (max-width: 520px){ .hm-form{ grid-template-columns: 1fr; } }

    .hm-form label{ display:flex; flex-direction:column; gap:6px; font-size: 12px; opacity:.9; }
    .hm-form input, .hm-form select{ width:100%; padding: 10px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.25); color: #eee; outline:none; }
    .hm-form input:focus, .hm-form select:focus{ border-color: rgba(0,255,160,0.35); box-shadow: 0 0 0 3px rgba(0,255,160,0.10); }

    .hm-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; align-items:center; }
    .hm-btn{ padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,255,160,0.10); color:#eafff7; cursor:pointer; font-weight:700; }
    .hm-btn:hover{ background: rgba(0,255,160,0.16); }
    .hm-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .hm-note{ font-size: 12px; opacity: .75; }

    .hm-viz{ display:grid; grid-template-columns: 1fr 70px; gap: 12px; align-items:start; }
    @media (max-width: 980px){ .hm-viz{ grid-template-columns: 1fr; } }

    .hm-canvas-wrap{ position:relative; width:100%; overflow:hidden; }
    #hmCanvas{ width: 100%; height: auto; image-rendering: pixelated; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); }

    .hm-legend{ display:flex; flex-direction:column; gap:8px; }
    #hmLegend{ width: 70px; height: 360px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); }
    .hm-legend-text{ font-size: 12px; opacity:.85; display:flex; justify-content:space-between; }

    .hm-tooltip{ position:absolute; pointer-events:none; padding: 8px 10px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.72); color:#eee;
      font-size: 12px; opacity:0; transform: translate(-50%, -120%); white-space:nowrap; }

    .hm-progress{ margin-top: 10px; font-size: 12px; opacity:.8; }
    .hm-progress-bar{ height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow:hidden; }
    .hm-progress-bar > div{ height:100%; width:0%; background: rgba(0,255,160,0.45); }

    .hm-cost-title{ margin-top: 10px; font-size: 12px; font-weight: 800; opacity:.85; }
    .hm-cost-grid{ display:grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 10px 12px; margin-top: 10px; }
    @media (max-width: 520px){ .hm-cost-grid{ grid-template-columns: 1fr; } }
    .hm-cost-grid label{ display:flex; flex-direction:column; gap:6px; font-size: 12px; opacity:.9; }

  </style>
</head>
<body>
  <div class="hm-wrap">
    <div class="hm-head">
      <div>
        <div class="hm-title">參數熱力圖：Fast(1–255) × Slow(1–255)</div>
        <div class="hm-sub">用你 simulator 的 MA 交叉邏輯做回測，把結果畫成 heatmap（支援 Fee / Tax）。</div>
      </div>
    </div>

    <div class="hm-grid">
      <div class="hm-card">
        <h3>設定</h3>

        <div class="hm-form">
          <label>Stock
            <select id="stockSelect"></select>
          </label>

          <label>MA Type
            <select id="hmMAType">
              <option value="MA">SMA</option>
              <option value="WMA">WMA</option>
              <option value="EMA">EMA</option>
            </select>
          </label>

          <label>Date Start
            <input id="simStartDate" type="date" />
          </label>

          <label>Date End
            <input id="simEndDate" type="date" />
          </label>

          <label>Fund
            <input id="simFund" type="number" step="1" value="100000" />
          </label>

          <label>Fill
            <select id="simFill">
              <option value="signalClose">Signal Close</option>
              <option value="nextClose">Next Close</option>
            </select>
          </label>

          <label>Metric
            <select id="hmMetric">
              <option value="roi">ROI %</option>
              <option value="nav">NAV</option>
            </select>
          </label>

          <label>Only Slow &gt; Fast
            <select id="hmOnlyUpper" >
              <option value="1" selected>Yes</option>
              <option value="0">No</option>
            </select>
          </label>
        </div>

        <div class="hm-cost-title">交易成本（可調）</div>
        <div class="hm-cost-grid">
          <label>Fee Rate
            <input id="simFeeRate" type="number" step="0.000001" value="0.001425">
          </label>
          <label>Fee Disc
            <input id="simFeeDiscount" type="number" step="0.01" value="1">
          </label>
          <label>Fee Min
            <input id="simFeeMin" type="number" step="0.01" value="0">
          </label>
          <label>Fee Max
            <input id="simFeeMax" type="number" step="0.01" value="1e100">
          </label>

          <label>Tax Rate (SELL)
            <input id="simTaxRate" type="number" step="0.000001" value="0">
          </label>
          <label>Tax Min
            <input id="simTaxMin" type="number" step="0.01" value="0">
          </label>
          <label>Tax Max
            <input id="simTaxMax" type="number" step="0.01" value="1e100">
          </label>
        </div>

        <div class="hm-actions">
          <button id="hmRun" class="hm-btn">Generate Heatmap</button>
          <button id="hmDownload" class="hm-btn" style="background:rgba(255,255,255,0.06);" disabled>Download CSV</button>
          <div class="hm-note">提示：255×255 會比較吃 CPU；可先縮短日期區間。</div>
        </div>

        <div class="hm-progress" id="hmProgressText" style="display:none;">Preparing…</div>
        <div class="hm-progress-bar" style="margin-top:8px; display:none;" id="hmProgressBar">
          <div id="hmProgressFill"></div>
        </div>
      </div>

      <div class="hm-card">
        <h3>Heatmap</h3>
        <div class="hm-viz">
          <div class="hm-canvas-wrap" id="hmCanvasWrap">
            <canvas id="hmCanvas" width="255" height="255"></canvas>
            <div class="hm-tooltip" id="hmTip"></div>
          </div>
          <div class="hm-legend">
            <canvas id="hmLegend" width="70" height="360"></canvas>
            <div class="hm-legend-text"><span id="hmMin">—</span><span id="hmMax">—</span></div>
          </div>
        </div>
        <div class="hm-sub" style="margin-top:10px;">X 軸 = Slow period（1→255），Y 軸 = Fast period（1→255）。</div>
      </div>
    </div>
  </div>

  <script src="heatmap.js"></script>
</body>
</html>
